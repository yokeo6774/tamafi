name: Build TamaFi for ES3C28P

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Arduino CLI & esptool
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          sudo mv bin/arduino-cli /usr/local/bin/
          pip install esptool

      - name: Install ESP32 Core & Libraries
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.7
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Compile TamaFi Sketch
        run: |
          mkdir -p build_out
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=huge_app \
            --output-dir build_out \
            TamaFi

      - name: Merge Binaries for Launcher / Flasher
        run: |
          python -m esptool --chip esp32s3 merge_bin \
            -o build_out/TamaFi-ES3C28P-merged.bin \
            --flash_mode dio \
            --flash_freq 80m \
            --flash_size 16MB \
            0x0 build_out/TamaFi.ino.bootloader.bin \
            0x8000 build_out/TamaFi.ino.partitions.bin \
            0x10000 build_out/TamaFi.ino.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamaFi-ES3C28P-Firmware
          path: build_out/TamaFi-ES3C28P-merged.bin
