name: Feature request
description: Suggest a firmware, hardware-profile, or documentation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be added or changed?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this useful?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Display
        - Touch
        - Audio
        - LED
        - UI
        - Pet logic
        - Documentation
        - Build tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed implementation
